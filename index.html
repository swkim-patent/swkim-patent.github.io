<style>
:root{
  --navy:#14213d; --ink:#1c2230; --muted:#5b6474; --line:#e3e6ec;
  --bg:#fff; --soft:#f6f7f9; --accent:#b08d57;
  --sans:"Noto Sans KR","Noto Sans JP",system-ui,sans-serif;
  --serif:"Noto Serif KR","Noto Serif JP",Georgia,serif;
}
html[lang="ja"]{--sans:"Noto Sans JP","Noto Sans KR",system-ui,sans-serif;--serif:"Noto Serif JP","Noto Serif KR",Georgia,serif}
*{box-sizing:border-box;margin:0;padding:0}
body{font-family:var(--sans);color:var(--ink);background:var(--bg);line-height:1.75;font-size:16px;-webkit-font-smoothing:antialiased}
a{color:inherit;text-decoration:none}
img{max-width:100%;display:block}
.wrap{max-width:1080px;margin:0 auto;padding:0 24px}
.narrow{max-width:720px}

/* header */
header{position:sticky;top:0;z-index:10;background:rgba(255,255,255,.95);backdrop-filter:blur(8px);border-bottom:1px solid var(--line)}
.bar{display:flex;align-items:center;justify-content:space-between;height:68px;gap:16px}
.logo{font-family:var(--serif);font-weight:700;font-size:21px;color:var(--navy);letter-spacing:.01em}
.logo em{font-style:normal;color:var(--accent)}
nav ul{display:flex;gap:28px;list-style:none;font-size:14.5px;color:var(--muted)}
nav a:hover,nav a.on{color:var(--navy)}
nav a.on{font-weight:500}
.right{display:flex;align-items:center;gap:12px}
.lang{display:flex;border:1px solid var(--line);border-radius:6px;overflow:hidden}
.lang button{border:0;background:none;padding:6px 10px;font:500 12.5px var(--sans);color:var(--muted);cursor:pointer}
.lang button.on{background:var(--navy);color:#fff}
.menu-btn{display:none;border:1px solid var(--line);background:none;border-radius:6px;padding:6px 10px;font-size:14px;cursor:pointer;color:var(--navy)}

/* common */
.eyebrow{font-size:12.5px;letter-spacing:.22em;color:var(--accent);text-transform:uppercase;margin-bottom:14px}
h2.title{font-family:var(--serif);font-size:clamp(26px,3.4vw,34px);color:var(--navy);line-height:1.35}
section{padding:88px 0}
section.soft{background:var(--soft)}
.sec-head{margin-bottom:40px;display:flex;justify-content:space-between;align-items:end;gap:16px;flex-wrap:wrap}
.more{font-size:14px;color:var(--muted);border-bottom:1px solid var(--line);padding-bottom:2px}
.more:hover{color:var(--navy);border-color:var(--navy)}

/* hero */
.hero{background:var(--navy);color:#fff;padding:110px 0 100px;position:relative;overflow:hidden}
.hero::after{content:"";position:absolute;right:-120px;top:-120px;width:460px;height:460px;border:1px solid rgba(255,255,255,.08);border-radius:50%}
.hero::before{content:"";position:absolute;right:-40px;top:-40px;width:300px;height:300px;border:1px solid rgba(176,141,87,.28);border-radius:50%}
.hero h1{font-family:var(--serif);font-size:clamp(32px,5vw,50px);line-height:1.3;margin-bottom:22px;max-width:760px}
.hero p{font-size:17px;color:rgba(255,255,255,.78);max-width:600px}

/* entry cards */
.entries{display:grid;grid-template-columns:1fr 1fr;gap:24px}
.entry{border:1px solid var(--line);padding:40px 36px;transition:.2s;display:block;background:#fff}
.entry:hover{border-color:var(--navy)}
.entry h3{font-family:var(--serif);font-size:24px;color:var(--navy);margin:6px 0 10px}
.entry p{color:var(--muted);font-size:15px}
.entry .go{margin-top:22px;font-size:14px;color:var(--navy);font-weight:500}

/* posts */
.posts{display:grid;grid-template-columns:repeat(3,1fr);gap:24px}
.post{background:#fff;border:1px solid var(--line);display:flex;flex-direction:column;transition:.2s}
.post:hover{border-color:var(--navy)}
.cover{aspect-ratio:16/10;background:linear-gradient(150deg,#1f3160,#14213d);display:flex;align-items:center;justify-content:center;color:rgba(255,255,255,.75);font-family:var(--serif);font-size:15px;letter-spacing:.1em;overflow:hidden}
.cover img{width:100%;height:100%;object-fit:cover}
.cover.c-trip{background:linear-gradient(150deg,#3a5a78,#1f3550)}
.cover.c-travel{background:linear-gradient(150deg,#5d7f6e,#2f4d43)}
.cover.c-food{background:linear-gradient(150deg,#a0714f,#6b4630)}
.cover.c-golf{background:linear-gradient(150deg,#6f8d4f,#3f5a2c)}
.cover.c-daily{background:linear-gradient(150deg,#8a8fa0,#565b6b)}
.post .body{padding:24px 24px 26px;flex:1;display:flex;flex-direction:column}
.cat{font-size:12px;letter-spacing:.1em;color:var(--accent);margin-bottom:8px}
.post h3{font-family:var(--serif);font-size:17.5px;color:var(--navy);line-height:1.5;margin-bottom:8px}
.post p{font-size:14px;color:var(--muted);flex:1}
.date{font-size:13px;color:var(--muted);margin-top:12px}
.empty{padding:56px 24px;text-align:center;color:var(--muted);border:1px dashed var(--line);background:#fff;grid-column:1/-1}

/* chips */
.chips{display:flex;flex-wrap:wrap;gap:8px;margin-bottom:32px}
.chips button{border:1px solid var(--line);background:#fff;padding:7px 16px;font:500 14px var(--sans);color:var(--muted);cursor:pointer;border-radius:999px}
.chips button.on{background:var(--navy);border-color:var(--navy);color:#fff}

/* practice */
.grid4{display:grid;grid-template-columns:repeat(2,1fr);gap:1px;background:var(--line);border:1px solid var(--line)}
.card{background:#fff;padding:38px 34px}
.card .num{font-family:var(--serif);color:var(--accent);font-size:14px;margin-bottom:12px}
.card h3{font-family:var(--serif);font-size:20px;color:var(--navy);margin-bottom:10px}
.card p{font-size:15px;color:var(--muted)}
.tech{display:grid;grid-template-columns:1fr 1fr;gap:32px}
.tech-item{border-left:2px solid var(--navy);padding:6px 0 6px 26px}
.tech-item h3{font-family:var(--serif);font-size:20px;color:var(--navy);margin-bottom:8px}
.tech-item p{font-size:15px;color:var(--muted);margin-bottom:12px}
.tags{display:flex;flex-wrap:wrap;gap:8px}
.tags span{font-size:12.5px;padding:4px 12px;border:1px solid var(--line);background:#fff;color:#3a4252}

/* about */
.about{display:grid;grid-template-columns:240px 1fr;gap:56px;align-items:start}
.mono{aspect-ratio:1;background:var(--navy);color:#fff;display:flex;flex-direction:column;align-items:center;justify-content:center;font-family:var(--serif)}
.mono b{font-size:56px;letter-spacing:.04em;line-height:1}
.mono span{font-size:13px;color:var(--accent);letter-spacing:.2em;margin-top:12px}
.about-text h3{font-family:var(--serif);font-size:28px;color:var(--navy);margin-bottom:4px}
.about-text .sub{color:var(--muted);font-size:15px;margin-bottom:24px}
.about-text p{margin-bottom:16px;color:#333b4a}
.facts{display:grid;grid-template-columns:1fr 1fr;gap:28px;margin-top:32px;padding-top:28px;border-top:1px solid var(--line)}
.facts h4{font-size:13px;letter-spacing:.12em;color:var(--accent);margin-bottom:8px;font-weight:500}
.facts ul{list-style:none;font-size:15px;color:#333b4a}
.facts li{padding:3px 0}

/* article */
.article{padding:72px 0 96px}
.back{font-size:14px;color:var(--muted);display:inline-block;margin-bottom:28px}
.back:hover{color:var(--navy)}
.article h1{font-family:var(--serif);font-size:clamp(28px,4vw,38px);color:var(--navy);line-height:1.35;margin:6px 0 12px}
.article .meta{color:var(--muted);font-size:14px;padding-bottom:28px;border-bottom:1px solid var(--line);margin-bottom:36px}
.content{font-size:17px;line-height:1.95;color:#2a3140}
.content p{margin-bottom:22px}
.content h2{font-family:var(--serif);color:var(--navy);font-size:23px;margin:40px 0 14px}
.content img{margin:28px 0;width:100%}
.content blockquote{border-left:3px solid var(--accent);padding:4px 0 4px 20px;color:var(--muted);margin:0 0 22px}

/* contact & footer */
.contact{background:var(--navy);color:#fff}
.contact h2.title{color:#fff}
.contact-grid{display:grid;grid-template-columns:1.2fr 1fr;gap:56px}
.contact .lead{color:rgba(255,255,255,.78)}
.info{list-style:none;border-top:1px solid rgba(255,255,255,.15)}
.info li{display:flex;gap:20px;padding:16px 0;border-bottom:1px solid rgba(255,255,255,.15);font-size:15px}
.info b{width:80px;flex-shrink:0;font-weight:500;color:var(--accent);font-size:13px;letter-spacing:.08em;padding-top:2px}
footer{background:#0e1830;color:rgba(255,255,255,.5);font-size:12.5px;padding:30px 0}
footer .wrap{display:flex;justify-content:space-between;gap:16px;flex-wrap:wrap}

@media (max-width:860px){
  .menu-btn{display:block}
  nav{display:none;position:absolute;top:68px;left:0;right:0;background:#fff;border-bottom:1px solid var(--line)}
  nav.open{display:block}
  nav ul{flex-direction:column;gap:0;padding:8px 24px 16px}
  nav li a{display:block;padding:10px 0}
  .entries,.about,.contact-grid,.tech,.grid4,.posts{grid-template-columns:1fr}
  .about{gap:32px}.mono{max-width:180px}
  section{padding:64px 0}
  .hero{padding:84px 0 76px}
}
@media (max-width:480px){
  .wrap{padding:0 16px}
  .facts{grid-template-columns:1fr}
  .card,.entry{padding:30px 22px}
  nav ul{padding:8px 16px 16px}
}
</style>

 "about.title":"プロフィール","about.name":"金世元","about.sub":"韓国弁理士 · Sewon Kim · 김세원",
 "about.p1":"ソウル大学校電気工学科を卒業し、1999年に韓国弁理士試験に合格しました。電気・電子・通信およびソフトウェア・AI分野を中心に、特許出願、中間処理、審判業務を手がけてまいりました。",
 "about.p2":"国内外のお客様と韓国語・英語・日本語でやり取りしながら仕事をしています。ここでは業務の話とともに、出張や旅行、おいしい食事、ゴルフなど日常の記録も残していきます。",
 "about.edu":"学歴","about.edu1":"ソウル大学校 電気工学科 卒業",
 "about.career":"資格","about.c1":"韓国弁理士（1999年 弁理士試験合格）",
 "about.lang":"言語","about.lang1":"韓国語 · 英語 · 日本語",
 "about.field":"技術分野","about.field1":"電気・電子・通信、ソフトウェア・AI",
 "contact.title":"お問い合わせ","contact.lead":"ご相談やご挨拶など、お気軽にメールでご連絡ください。韓国語・英語・日本語で返信いたします。",
 "back":"← 一覧へ戻る","footer.note":"本サイトの内容は一般的な情報提供を目的としたものであり、法的助言ではありません。"
}};

/* ===== 연락처 (공개할 정보로 바꾸세요) ===== */
const CONTACT = { email: "your@email.com" };

let lang = "ko";
const t = k => (T[lang] && T[lang][k]) ?? T.ko[k] ?? k;
const pick = v => (v && typeof v === "object") ? (v[lang] || v.ko || "") : (v || "");
let posts = [], loaded = false;   // 글은 관리자 페이지(/admin)에서 작성 → posts.json으로 자동 생성
const esc = s => String(s).replace(/[&<>"]/g, c => ({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[c]));

function card(p){
  const cover = p.cover ? `<img src="${esc(p.cover)}" alt="" loading="lazy">` : esc(t("cat."+p.category));
  return `<a class="post" href="#/post/${esc(p.id)}">
    <div class="cover c-${esc(p.category)}">${cover}</div>
    <div class="body"><div class="cat">${esc(t("cat."+p.category))}</div>
    <h3>${esc(pick(p.title))}</h3><p>${esc(pick(p.summary))}</p>
    <div class="date">${esc(p.date.replace(/-/g,"."))}</div></div></a>`;
}
const list = arr => arr.length ? arr.map(card).join("") : `<div class="empty">${loaded ? t("empty") : "…"}</div>`;
const tags = k => t(k).split(",").map(s => `<span>${esc(s)}</span>`).join("");

const contactBlock = () => `
<section class="contact"><div class="wrap">
  <div class="sec-head"><div><div class="eyebrow">Contact</div><h2 class="title">${t("contact.title")}</h2></div></div>
  <div class="contact-grid"><p class="lead">${t("contact.lead")}</p>
  <ul class="info"><li><b>EMAIL</b><a href="mailto:${CONTACT.email}">${CONTACT.email}</a></li>
  <li><b>WEB</b><span>sewonlog.com</span></li></ul></div>
</div></section>`;

const views = {
home(){
  return `
  <div class="hero"><div class="wrap">
    <div class="eyebrow">${t("hero.eyebrow")}</div>
    <h1>${t("hero.title")}</h1><p>${t("hero.desc")}</p>
  </div></div>
  <section><div class="wrap"><div class="entries">
    <a class="entry" href="#/patent"><div class="eyebrow">Work</div><h3>${t("entry.patent.t")}</h3><p>${t("entry.patent.d")}</p><div class="go">${t("go")}</div></a>
    <a class="entry" href="#/log"><div class="eyebrow">Log</div><h3>${t("entry.log.t")}</h3><p>${t("entry.log.d")}</p><div class="go">${t("go")}</div></a>
  </div></div></section>
  <section class="soft"><div class="wrap">
    <div class="sec-head"><div><div class="eyebrow">Recent</div><h2 class="title">${t("recent")}</h2></div><a class="more" href="#/log">${t("all")}</a></div>
    <div class="posts">${list(posts.slice(0,6))}</div>
  </div></section>`;
},
patent(){
  const cols = posts.filter(p => p.category === "patent");
  const areas = [1,2,3,4].map(i => `<div class="card"><div class="num">0${i}</div><h3>${t("p"+i+".t")}</h3><p>${t("p"+i+".d")}</p></div>`).join("");
  return `
  <section><div class="wrap">
    <div class="sec-head"><div><div class="eyebrow">Practice Areas</div><h2 class="title">${t("practice")}</h2></div></div>
    <div class="grid4">${areas}</div>
  </div></section>
  <section class="soft"><div class="wrap">
    <div class="sec-head"><div><div class="eyebrow">Technology</div><h2 class="title">${t("techfield")}</h2></div></div>
    <div class="tech">
      <div class="tech-item"><h3>${t("t1.t")}</h3><p>${t("t1.d")}</p><div class="tags">${tags("t1.tags")}</div></div>
      <div class="tech-item"><h3>${t("t2.t")}</h3><p>${t("t2.d")}</p><div class="tags">${tags("t2.tags")}</div></div>
    </div>
  </div></section>
  <section><div class="wrap">
    <div class="sec-head"><div><div class="eyebrow">Columns</div><h2 class="title">${t("columns")}</h2></div></div>
    <div class="posts">${list(cols)}</div>
  </div></section>
  ${contactBlock()}`;
},
log(cat){
  const cats = ["all","trip","travel","food","golf","daily","patent"];
  const cur = cats.includes(cat) ? cat : "all";
  const arr = cur === "all" ? posts : posts.filter(p => p.category === cur);
  const chips = cats.map(c => `<button class="${c===cur?"on":""}" onclick="location.hash='#/log${c==="all"?"":"/"+c}'">${t("cat."+c)}</button>`).join("");
  return `
  <section><div class="wrap">
    <div class="sec-head"><div><div class="eyebrow">Log</div><h2 class="title">${t("log.title")}</h2></div></div>
    <div class="chips">${chips}</div>
    <div class="posts">${list(arr)}</div>
  </div></section>`;
},
post(id){
  const p = posts.find(x => x.id === id);
  if(!p) return loaded ? views.log() : `<div class="article"><div class="wrap narrow"><div class="empty">…</div></div></div>`;
  const backTo = p.category === "patent" ? "#/patent" : "#/log";
  return `
  <div class="article"><div class="wrap narrow">
    <a class="back" href="${backTo}">${t("back")}</a>
    <div class="cat">${esc(t("cat."+p.category))}</div>
    <h1>${esc(pick(p.title))}</h1>
    <div class="meta">${esc(p.date.replace(/-/g,"."))}${p.place ? " · " + esc(pick(p.place)) : ""}</div>
    <div class="content">${pick(p.body)}</div>
  </div></div>`;
},
about(){
  return `
  <section><div class="wrap">
    <div class="sec-head"><div><div class="eyebrow">About</div><h2 class="title">${t("about.title")}</h2></div></div>
    <div class="about">
      <div class="mono"><b>SK</b><span>SEWONLOG</span></div>
      <div class="about-text">
        <h3>${t("about.name")}</h3><div class="sub">${t("about.sub")}</div>
        <p>${t("about.p1")}</p><p>${t("about.p2")}</p>
        <div class="facts">
          <div><h4>${t("about.edu")}</h4><ul><li>${t("about.edu1")}</li></ul></div>
          <div><h4>${t("about.career")}</h4><ul><li>${t("about.c1")}</li></ul></div>
          <div><h4>${t("about.field")}</h4><ul><li>${t("about.field1")}</li></ul></div>
          <div><h4>${t("about.lang")}</h4><ul><li>${t("about.lang1")}</li></ul></div>
        </div>
      </div>
    </div>
  </div></section>
  ${contactBlock()}`;
}};

function render(){
  const parts = (location.hash.replace(/^#\/?/, "") || "").split("/");
  const route = parts[0] || "home";
  const fn = views[route] || views.home;
  document.getElementById("app").innerHTML = fn(parts[1] ? decodeURIComponent(parts[1]) : undefined);
  document.querySelectorAll("[data-t]").forEach(el => el.innerHTML = t(el.dataset.t));
  document.querySelectorAll("nav a").forEach(a => a.classList.toggle("on", a.dataset.route === (route === "post" ? "log" : route)));
  document.getElementById("nav").classList.remove("open");
  const p = route === "post" && posts.find(x => x.id === parts[1]);
  document.title = p ? `${pick(p.title)} | sewonlog` : "sewonlog | " + (lang==="ko"?"변리사 김세원":lang==="ja"?"弁理士 金世元":"Sewon Kim, Patent Attorney");
  window.scrollTo(0,0);
}
function setLang(l){
  lang = T[l] ? l : "ko";
  document.documentElement.lang = lang;
  document.querySelectorAll(".lang button").forEach(b => b.classList.toggle("on", b.dataset.lang === lang));
  try { localStorage.setItem("lang", lang); } catch(e) {}
  render();
}
document.querySelectorAll(".lang button").forEach(b => b.onclick = () => setLang(b.dataset.lang));
document.getElementById("menuBtn").onclick = () => document.getElementById("nav").classList.toggle("open");
window.addEventListener("hashchange", render);

let init = "";
try { init = localStorage.getItem("lang") || ""; } catch(e) {}
if(!init){ const n = (navigator.language||"ko").slice(0,2); init = ["ko","en","ja"].includes(n) ? n : "en"; }
setLang(init);

fetch("/posts.json", {cache: "no-cache"})
  .then(r => r.json())
  .then(d => { posts = (d || []).filter(p => p && p.id).sort((a,b) => b.date.localeCompare(a.date)); })
  .catch(() => {})
  .finally(() => { loaded = true; render(); });
</script>
</body>
</html>
